
name: Build Minecraft Forge Mod

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "6.8.3"

      - name: Extract source
        run: |
          unzip -o MinimalClient1165-source.zip
          test -f MinimalClient1165/build.gradle

      - name: Build JAR
        working-directory: MinimalClient1165
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: MinimalClient1165-JAR
          path: MinimalClient1165/build/libs/*.jar
          if-no-files-found: error
